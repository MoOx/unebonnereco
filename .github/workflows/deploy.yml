name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Rebuild when the catalogue or the app changes, not on pipeline-only edits.
    paths:
      - "app/**"
      - "ui/**"
      - "data/**"
      - "src/types.ts"
      - "app.json"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      # GitHub Pages serves from a sub-path and does not run Jekyll; without this
      # it would drop the _expo directory the bundle lives in.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
